<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writings &middot; Sukone Hong</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #F5F1EB;
    color: #111111;
  }

  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    padding: 80px 24px;
    box-sizing: border-box;
  }

  .container {
    max-width: 610px;
    margin: 0 auto;
  }

  a.back {
    font-size: 14px;
    color: #777777;
    text-decoration: none;
  }

  h1 {
    font-size: 24px;
    margin: 24px 0 24px 0;
  }

  p.intro {
    font-size: 13px;
    line-height: 1.5;
    color: #777777;
    margin: 0 0 40px 0;
  }

  .section-label {
    font-size: 12px;
    color: #999999;
    margin: 40px 0 8px 0;
  }

  .portfolio {
    border-top: 1px solid #e5e5e5;
  }

  .portfolio-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid #e5e5e5;
  }

  .portfolio-row .logo {
    width: 44px;
    height: 44px;
    border-radius: 0;
    flex: none;
    margin: 6px;
    box-shadow: 0 0 0 6px rgba(120, 120, 140, 0.16);
  }

  .portfolio-row .txt {
    flex: 1;
    min-width: 0;
  }

  .portfolio-row .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }

  .portfolio-row .name {
    font-size: 14px;
  }

  .portfolio-row .name a {
    color: #111111;
  }

  .portfolio-row .loc {
    font-size: 12px;
    color: #999999;
    white-space: nowrap;
  }

  .portfolio-row .more {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    font-size: 12px;
    color: #111111;
    text-decoration: none;
    border: 1px solid rgba(0, 0, 0, 0.25);
  }

  .portfolio-row .more:hover {
    background: rgba(0, 0, 0, 0.06);
  }

  .portfolio-row .desc {
    display: block;
    font-size: 12px;
    line-height: 1.5;
    color: #777777;
    margin-top: 4px;
  }
  a.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    color: #aaaaaa;
  }

  a.back svg {
    flex: none;
  }
</style>
</head>
<body>
  <div class="container">
    <a class="back" href="/"><svg width="17" height="13" viewBox="110 85 360 275" fill="none" stroke="currentColor" aria-hidden="true"><path d="M120 222H462" stroke-width="36"/><path d="M235 95C235 165 188 222 130 222C188 222 235 279 235 349" stroke-width="34"/></svg> back</a>
    <h1>writings</h1>
    <p class="intro">a collection of my <strong>thoughts</strong> [and] <strong>philosophy</strong> [or] <strong>art</strong>.</p>

    <div class="portfolio">
      <div class="portfolio-row">
        <div class="txt">
          <div class="head"><span class="name">Realization</span></div>
          <a class="more" href="/writings/realization/">read more</a>
        </div>
        <span class="loc">Oct 1, 2026</span>
      </div>
    </div>

  </div>
</body>
</html>
