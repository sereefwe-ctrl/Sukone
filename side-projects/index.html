<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Projects &middot; Sukone Hong</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #F5F1EB;
    color: #111111;
  }

  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    padding: 80px 24px;
    box-sizing: border-box;
  }

  .container {
    max-width: 610px;
    margin: 0 auto;
  }

  a.back {
    font-size: 14px;
    color: #777777;
    text-decoration: none;
  }

  h1 {
    font-size: 24px;
    margin: 24px 0 24px 0;
  }

  p.intro {
    font-size: 13px;
    line-height: 1.5;
    color: #777777;
    margin: 0 0 40px 0;
  }

  .section-label {
    font-size: 12px;
    color: #999999;
    margin: 40px 0 8px 0;
  }

  .portfolio {
    border-top: 1px solid #e5e5e5;
  }

  .portfolio-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid #e5e5e5;
  }

  .portfolio-row .logo {
    width: 44px;
    height: 44px;
    border-radius: 0;
    flex: none;
  }

  .portfolio-row .txt {
    flex: 1;
    min-width: 0;
  }

  .portfolio-row .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }

  .portfolio-row .name {
    font-size: 14px;
  }

  .portfolio-row .name a {
    color: #111111;
  }

  .portfolio-row .loc {
    font-size: 12px;
    color: #999999;
    white-space: nowrap;
  }

  .portfolio-row .desc {
    display: block;
    font-size: 12px;
    line-height: 1.5;
    color: #777777;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="container">
    <a class="back" href="/">&larr; back</a>
    <h1>side projects</h1>
    <p class="intro">companies [or] projects I&rsquo;m incubating.</p>

    <div class="portfolio">
      <div class="portfolio-row">
        <img class="logo" src="/images/onomatopoeia.png" alt="ARCADIA logo" width="44" height="44">
        <div class="txt">
          <div class="head"><span class="name"><a href="https://www.arcadiafellows.com/" target="_blank" rel="noopener">ARCADIA</a></span></div>
          <span class="desc">a real or imaginary place of rural peace.</span>
        </div>
        <span class="loc">SF</span>
      </div>
      <div class="portfolio-row">
        <img class="logo" src="/images/attentionx.png" alt="AttentionX logo" width="44" height="44">
        <div class="txt">
          <div class="head"><span class="name"><a href="https://www.attentionx.org/" target="_blank" rel="noopener">AttentionX</a></span></div>
          <span class="desc">launchpad for frontier labs entering Korea.</span>
        </div>
        <span class="loc">Seoul</span>
      </div>
      <div class="portfolio-row">
        <img class="logo" src="/images/arcadia.jpg" alt="Onomatopoeia logo" width="44" height="44">
        <div class="txt">
          <div class="head"><span class="name">Onomatopoeia</span></div>
          <span class="desc">stealth.</span>
        </div>
        <span class="loc">SF</span>
      </div>
    </div>

  </div>
</body>
</html>
