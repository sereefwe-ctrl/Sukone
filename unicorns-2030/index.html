<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helping 10 Friends Build 10 Unicorns by 2030 &middot; Sukone Hong</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #ffffff;
    color: #111111;
  }

  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    padding: 80px 24px;
    box-sizing: border-box;
  }

  .container {
    max-width: 540px;
    margin: 0 auto;
  }

  a.back {
    font-size: 14px;
    color: #777777;
    text-decoration: none;
  }

  h1 {
    font-size: 22px;
    margin: 24px 0 32px 0;
    line-height: 1.4;
  }

  #gate p {
    font-size: 14px;
    color: #777777;
    margin: 0 0 16px 0;
  }

  #gate input {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid #dddddd;
    border-radius: 4px;
    width: 200px;
    box-sizing: border-box;
  }

  #gate button {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    font-size: 14px;
    padding: 8px 14px;
    margin-left: 8px;
    border: 1px solid #111111;
    background: #111111;
    color: #ffffff;
    border-radius: 4px;
    cursor: pointer;
  }

  #error {
    display: none;
    font-size: 13px;
    color: #c94a49;
    margin-top: 12px;
  }

  #content {
    display: none;
  }

  #content p {
    font-size: 15px;
    line-height: 1.6;
    color: #444444;
  }
</style>
</head>
<body>
  <div class="container">
    <a class="back" href="/writings/">&larr; back</a>
    <h1>Helping 10 Friends Build 10 Unicorns by 2030</h1>

    <div id="gate">
      <p>this post is password protected.</p>
      <form onsubmit="checkPw(); return false;">
        <input type="password" id="pw" placeholder="password" autofocus>
        <button type="submit">enter</button>
      </form>
      <p id="error">incorrect password.</p>
    </div>

    <div id="content">
      <p>coming soon.</p>
    </div>
  </div>

  <script>
    var PASSWORD = 'napoleonicambition2026';

    function unlock() {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }

    function relock() {
      document.getElementById('gate').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      document.getElementById('pw').value = '';
      document.getElementById('error').style.display = 'none';
    }

    function checkPw() {
      var val = document.getElementById('pw').value;
      if (val === PASSWORD) {
        unlock();
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        relock();
      }
    });
  </script>
</body>
</html>
